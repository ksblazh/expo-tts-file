name: iOS build

# Compiles the Swift the TS gate never touches, through the example app that autolinks
# the module. Split from the Android build so each platform carries its own status badge.
#
# Nothing here forces React Native to be built from source: this build uses Expo's
# default precompiled XCFrameworks, so a regression in them fails here rather than in
# someone's app. That is also what makes running on every pull request affordable — on
# SDK 56 the same job took ~28 minutes building React Native from source and only ran on
# main; on 57 it takes ~5 and catches broken Swift before a merge rather than after.
# A branch can still be checked directly:
#   gh workflow run ios.yml --ref <branch>

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'example/**'
      - 'expo-module.config.json'
      - 'package.json'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'example/**'
      - 'expo-module.config.json'
      - 'package.json'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS (Swift)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: example/package-lock.json
      - name: Install example dependencies
        working-directory: example
        run: npm ci
      - name: Prebuild the iOS project
        working-directory: example
        run: npx expo prebuild -p ios --no-install
      - name: Install pods
        working-directory: example/ios
        run: pod install
      - name: Build for the simulator
        working-directory: example/ios
        run: |
          WORKSPACE="$(ls -d *.xcworkspace | head -1)"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          echo "Building $SCHEME from $WORKSPACE"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
