name: Release (npm)

on:
  release:
    types: [published]
  workflow_dispatch: # rehearsal: builds, tests, packs — publishes nothing

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing (no token stored anywhere)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Trusted publishing needs a current npm for the OIDC token exchange, but the major
      # is pinned rather than tracked: `npm@latest` silently moved to 12, whose
      # `pack --json` output changed shape, and the packaging check that reads it would
      # have failed here alone while every other job stayed green. Raise this deliberately
      # and let the release rehearsal (`workflow_dispatch`) prove the new major first.
      - run: npm install -g npm@12
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint -- --max-warnings 0
      - run: npm test -- --ci
      # Packs and inspects the tarball: nothing untracked ships, no native source is
      # missing. Doubles as the workflow_dispatch rehearsal — it publishes nothing, and
      # unlike `npm publish --dry-run` it never consults the registry, so it does not
      # fail merely because the current version is already published.
      - run: npm run check:package
      - name: Guard — release tag matches package.json version
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Release tag $TAG != package.json version v$VERSION" >&2
            exit 1
          fi
      - name: Publish to npm (with provenance)
        if: github.event_name == 'release'
        run: npm publish
