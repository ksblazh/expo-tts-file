name: Native build

# Compiles the Kotlin and Swift the TS gate never touches. The module has no standalone
# Gradle/Xcode project — the example app autolinks it (`expo.autolinking.nativeModulesDir`),
# so both jobs prebuild the example and build the module through it.

on:
  # Kept in sync by hand — GitHub Actions does not support YAML anchors.
  pull_request:
    paths:
      - 'android/**'
      - 'ios/**'
      - 'example/**'
      - 'expo-module.config.json'
      - 'package.json'
      - '.github/workflows/native.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'ios/**'
      - 'example/**'
      - 'expo-module.config.json'
      - 'package.json'
      - '.github/workflows/native.yml'
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: example/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install example dependencies
        working-directory: example
        run: npm ci
      - name: Prebuild the Android project
        working-directory: example
        run: npx expo prebuild -p android --no-install
      # Builds the autolinked module library itself — no JS bundling, so this stays a
      # pure compile check of android/src.
      - name: Compile the module
        working-directory: example/android
        run: ./gradlew :expo-tts-file:assembleRelease --no-daemon

  ios:
    name: iOS (Swift)
    # macOS minutes are slow and this build compiles React Native from source (see the
    # SDK 56 precompiled-XCFramework note in the README), so it runs on main and on
    # demand rather than on every PR. To check a branch before merging:
    #   gh workflow run native.yml --ref <branch>
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      RCT_USE_PREBUILT_RNCORE: '0'
      RCT_USE_RN_DEP: '0'
      EXPO_USE_PRECOMPILED_MODULES: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: example/package-lock.json
      - name: Install example dependencies
        working-directory: example
        run: npm ci
      - name: Prebuild the iOS project
        working-directory: example
        run: npx expo prebuild -p ios --no-install
      - name: Install pods
        working-directory: example/ios
        run: pod install
      - name: Build for the simulator
        working-directory: example/ios
        run: |
          WORKSPACE="$(ls -d *.xcworkspace | head -1)"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          echo "Building $SCHEME from $WORKSPACE"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
